    <style>
      body {
        background-color: #050813;
        color: #ffffff;
        overflow-x: hidden;

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #050813;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #00E5FF, #B026FF);
        border-radius: 5px;
      }

      /* Cursor Trail */
      .circle-trail {
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background-color: rgba(0, 229, 255, 0.6);
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.1s;
        mix-blend-mode: screen;
        filter: blur(4px);
      }

      /* 3D Flip Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
